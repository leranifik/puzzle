# PuzzleHub — nginx reverse proxy
# Put into /etc/nginx/sites-available/puzzlehub and symlink to sites-enabled.
# Replace example.com with your domain. For TLS run: certbot --nginx -d example.com

# Long-lived immutable Next.js assets get aggressive caching.
map $uri $puzzlehub_cache {
    default                 "";
    ~^/_next/static/        "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # gzip for text responses (Next already serves pre-compressed where possible)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # allow QR-link claims and API bodies; game saves are max 50 KB
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-ready (harmless now, useful if live sync moves to WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control $puzzlehub_cache;
    }
}
