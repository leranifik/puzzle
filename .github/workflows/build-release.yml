name: Build & Publish (reusable)

# Shared release pipeline used by release.yml (manual version)
# and auto-release.yml (auto-computed version). Not triggered directly.
on:
  workflow_call:
    inputs:
      version:
        description: "Semver without the v prefix, e.g. 1.2.3"
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT: the server must run the same Node.js major version,
      # because better-sqlite3 is a native module compiled here.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci # .npmrc (legacy-peer-deps) is picked up automatically

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint src

      - name: Unit & integration tests
        run: npx vitest run

      - name: Build (standalone)
        run: npx next build

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          BUNDLE=puzzlehub-${{ inputs.version }}
          mkdir -p "dist/$BUNDLE"
          # standalone server + minimal runtime node_modules
          cp -r .next/standalone/. "dist/$BUNDLE/"
          # static assets are NOT included in standalone by design
          mkdir -p "dist/$BUNDLE/.next/static"
          cp -r .next/static/. "dist/$BUNDLE/.next/static/"
          cp -r public "dist/$BUNDLE/public"
          # DB bootstrap script (idempotent, uses bundled better-sqlite3)
          mkdir -p "dist/$BUNDLE/scripts"
          cp scripts/init-db.mjs "dist/$BUNDLE/scripts/"
          # version stamp for update scripts and sanity checks
          echo "${{ inputs.version }}" > "dist/$BUNDLE/VERSION"
          tar -C dist -czf "puzzlehub-${{ inputs.version }}.tar.gz" "$BUNDLE"
          ls -lh puzzlehub-${{ inputs.version }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PuzzleHub v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: puzzlehub-${{ inputs.version }}.tar.gz
          body: |
            Self-contained production bundle (Next.js standalone).

            **Server requirements:** Node.js 22.x, nothing else.

            Quick update on the server:
            ```bash
            sudo /opt/puzzlehub/update.sh v${{ inputs.version }}
            ```
            See `DEPLOY.md` in the repository for the full guide.
